spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://localhost:8086
          predicates:
            - Path=/api/auth/**
        - id: floods
          uri: http://localhost:8081
          predicates:
            - Path=/api/floods/**
        - id: droughts
          uri: http://localhost:8082
          predicates:
            - Path=/api/droughts/**
        - id: fires
          uri: http://localhost:8083
          predicates:
            - Path=/api/fires/**
        - id: zoonotic
          uri: http://localhost:8084
          predicates:
            - Path=/api/zoonotic/**
        - id: mining
          uri: http://localhost:8085
          predicates:
            - Path=/api/mining/**
        - id: dashboard
          uri: http://localhost:8087
          predicates:
            - Path=/api/dashboard/**
        - id: reports
          uri: http://localhost:8088
          predicates:
            - Path=/api/reports/**
        - id: alerts
          uri: http://localhost:8089
          predicates:
            - Path=/api/alerts/**
server:
  port: 8080
jwt:
  secret: dpdms-secret-2024-university-of-zimbabwe
